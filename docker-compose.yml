services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: runcast
      POSTGRES_USER: runcast
      POSTGRES_PASSWORD: runcast
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - runcast-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U runcast -d runcast']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  runcast-postgres:
